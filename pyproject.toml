[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iira2"
version = "0.1.0"
description = "Auditable cache-based Macro policy for precomputed medical evidence"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
